name: habit_tracker
description: ActivHealth designs tiny behavior loops for health, focus, calm, recovery, and mindful routines.
publish_to: 'none'
version: 2.0.0+16

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management — simple, no boilerplate
  provider: ^6.1.2

  # Local SQLite database
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4

  # Local notifications (iOS + Android)
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4

  # Date/time formatting
  intl: ^0.19.0

  # Device biometric authentication
  local_auth: ^2.3.0

  # Typography (Sora display / Inter body — Midnight Coach design system)
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Real SQLite on the host VM for data-layer tests (schema, migrations,
  # CRUD). Production uses sqflite via the iOS/Android plugin.
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
